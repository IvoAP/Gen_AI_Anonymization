[project]
name = "gen-ai-anonymization-baselines"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "smartnoise-synth==1.0.8",
    "opacus==0.14.0",
    "torch==2.4.1",
    "mbi>=1.1.0,<2",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5",
    "packaging>=23",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true