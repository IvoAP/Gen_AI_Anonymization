[project]
name = "gen-ai-anonymization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ivo Aguiar Pimenta", email = "ivoaguiarpimenta@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "opacus>=1.5",
    "tqdm>=4.66",
]

[project.scripts]
gen-ai-anonymization = "gen_ai_anonymization:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
